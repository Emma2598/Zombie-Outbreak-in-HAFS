<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기숙사 기생충성 좀비 확산 시뮬레이션 (SIRE 모델)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 950px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
        }
        .back-button {
            display: inline-block;
            text-decoration: none;
            color: #7f8c8d;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            padding: 6px 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            background: #fff;
            transition: all 0.2s;
        }
        .back-button:hover {
            color: #2c3e50;
            background: #f8f9fa;
            border-color: #7f8c8d;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .fixed-info {
            background: #e8f4fd;
            border-left: 5px solid #3498db;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 15px;
            color: #2c3e50;
        }
        .control-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .value-display {
            text-align: right;
            font-size: 14px;
            color: #8e44ad;
            font-weight: bold;
            margin-top: 4px;
        }
        .chart-container {
            position: relative;
            height: 420px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-button">⬅ 메인 화면으로</a>

    <h1>🐛 기숙사 기생충성 좀비 사태 확산 시뮬레이터</h1>
    <div class="subtitle">외대부고 Watson & 하나고 Yoong 연합 포럼 학술 데이터</div>
    
    <div class="fixed-info">
        📍 실험 조건: 기숙사 총 인원 (N) = 365명 고정 (초기 감염자 1명 포함)
    </div>
    
    <div class="control-panel">
        <div class="control-group">
            <label for="alpha">기생충 배출률 (Alpha - 환경 오염 속도)</label>
            <input type="range" id="alpha" min="0.1" max="2.0" step="0.1" value="1.0">
            <div class="value-display" id="alphaValue">1.0</div>
        </div>
        <div class="control-group">
            <label for="mu" style="color: #d35400;">★ 숙주 밖 사멸률 (Mu - 생명력 약화 지표)</label>
            <input type="range" id="mu" min="0.05" max="2.0" step="0.05" value="0.3">
            <div class="value-display" id="muValue" style="color: #d35400;">0.3</div>
        </div>
        <div class="control-group">
            <label for="beta">환경 감염률 (Beta - 접촉 시 감염 확률)</label>
            <input type="range" id="beta" min="0.05" max="1.0" step="0.05" value="0.3">
            <div class="value-display" id="betaValue">0.3</div>
        </div>
        <div class="control-group">
            <label for="gamma">학생회 대응력 (Gamma - 격리율)</label>
            <input type="range" id="gamma" min="0" max="1.0" step="0.05" value="0.05">
            <div class="value-display" id="gammaValue" style="color:#2ecc71;">0.05</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="sireChart"></canvas>
    </div>
</div>

<script>
    const TOTAL_POPULATION = 365;

    function calculateSIRE(alpha, mu, beta, gamma, days = 60) {
        let S = TOTAL_POPULATION - 1; 
        let I = 1;     
        let R = 0;     
        let E = 0; 
        
        const dt = 0.05; 
        const steps = days / dt;

        let dataS = [S];
        let dataI = [I];
        let dataR = [R];
        let dataE = [E];
        let labels = [0];

        for (let t = 1; t <= steps; t++) {
            let dS = (-beta * S * E / TOTAL_POPULATION) * dt;
            let dI = ((beta * S * E / TOTAL_POPULATION) - gamma * I) * dt;
            let dR = (gamma * I) * dt;
            let dE = (alpha * I - mu * E) * dt; 

            S += dS;
            I += dI;
            R += dR;
            E += dE;

            if (t % 20 === 0) { 
                dataS.push(Math.max(0, S));
                dataI.push(Math.max(0, I));
                dataR.push(Math.max(0, R));
                dataE.push(Math.max(0, E));
                labels.push(t / 20);
            }
        }
        return { labels, dataS, dataI, dataR, dataE };
    }

    const ctx = document.getElementById('sireChart').getContext('2d');
    let sireChart = new Error && typeof Chart !== 'undefined' ? new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { label: '미감염자 (S)', borderColor: '#3498db', borderWidth: 2, pointRadius: 0, fill: false, data: [] },
                { label: '감염자 / 좀비 (I)', borderColor: '#e74c3c', borderWidth: 2, pointRadius: 0, fill: false, data: [] },
                { label: '격리 / 무력화 (R)', borderColor: '#2ecc71', borderWidth: 2, pointRadius: 0, fill: false, data: [] },
                { 
                    label: '환경 내 기생충 부하량 (E)', 
                    borderColor: '#9b59b6', 
                    borderWidth: 2, 
                    borderDash: [5, 5], 
                    pointRadius: 0, 
                    fill: false, 
                    data: [] 
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: { title: { display: true, text: '시간 (Days)' } },
                y: { title: { display: true, text: '수량 / 개체 수' }, min: 0, max: 365 }
            }
        }
    }) : null;

    function updateChart() {
        if(!sireChart) return;
        const alpha = parseFloat(document.getElementById('alpha').value);
        const mu = parseFloat(document.getElementById('mu').value);
        const beta = parseFloat(document.getElementById('beta').value);
        const gamma = parseFloat(document.getElementById('gamma').value);

        document.getElementById('alphaValue').innerText = alpha.toFixed(1);
        document.getElementById('muValue').innerText = mu.toFixed(2) + (mu >= 1.0 ? " (생명력 매우 약함)" : " (생명력 강함)");
        document.getElementById('betaValue').innerText = beta.toFixed(2);
        document.getElementById('gammaValue').innerText = gamma.toFixed(2);

        const simData = calculateSIRE(alpha, mu, beta, gamma);

        sireChart.data.labels = simData.labels;
        sireChart.data.datasets[0].data = simData.dataS;
        sireChart.data.datasets[1].data = simData.dataI;
        sireChart.data.datasets[2].data = simData.dataR;
        sireChart.data.datasets[3].data = simData.dataE;
        sireChart.update();
    }

    document.querySelectorAll('input[type="range"]').forEach(slider => {
        slider.addEventListener('input', updateChart);
    });

    updateChart();
</script>

</body>
</html>
